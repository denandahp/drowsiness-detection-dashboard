<nav class="mt-3 px-4 py-2" aria-label="paginate">
    <div class="row">
        <div class="col-md-12">
            <ul class="pagination pagination-primary justify-content-end mb-0">
                {% if paginator.previous %}
                <li class="page-item page-next-prev c-pointer" id="page-prev">
                    <a class="page-link" href="{{paginator.previous_url}}"><i class="tf-icon bx bx-chevron-left"></i></a>
                </li>
                {% else %}
                <li class="page-item page-item-disabled page-next-prev c-pointer disabled" id="page-prev">
                    <a class="page-link"><i class="tf-icon bx bx-chevron-left"></i></a>
                </li>
                {% endif %}

                {% for page in paginator.pageNumberList %}
                  <li class="page-item {% if page.pageNumber == paginator.page_number %} active {% endif %}">
                    <a class="page-link" href="{{page.url}}">{{page.pageNumber}}</a>
                  </li>
                {% endfor %}

                {% if paginator.next %}
                <li class="page-item page-next-prev c-pointer" id="page-next">
                    <a class="page-link" href="{{paginator.next_url}}"><i class="tf-icon bx bx-chevron-right"></i></a>
                </li>
                {% else %}
                <li class="page-item page-item-disabled page-next-prev c-pointer disabled" id="page-next">
                    <a class="page-link"><i class="tf-icon bx bx-chevron-right"></i></a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
