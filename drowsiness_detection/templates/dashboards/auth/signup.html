{% load static %}
{% load static_files %}

<!DOCTYPE html>
<html
  lang="en"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="../assets/"
  data-template="vertical-menu-template-free"
>
  <head>
    {% include "layout/base_head.html" %}
    <!-- Page -->
    <link rel="stylesheet" href="{% sneat_assets "vendor/css/pages/page-auth.css" %}" />
  </head>

  <body>
    <!-- Content -->

    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <!-- Register Card -->
          <div class="card">
            <div class="card-body">
              <!-- Logo -->
              <div class="app-brand justify-content-center">
                <img src='{% static "assets/images/logo-siwagrha.png" %}' alt="Logo" style="width: 80%;" />
              </div>
              <!-- /Logo -->
              <h4 class="mb-2">Adventure starts here 🚀</h4>
              <!-- <p class="mb-4">Make your app management easy and fun!</p> -->

              <form id="formAuthentication" class="mb-3" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="id-first_name" class="form-label">First Name</label>
                      <input
                        type="text"
                        class="form-control"
                        id="id-first_name"
                        name="first_name"
                        placeholder="First name"
                        autofocus
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="id-last_name" class="form-label">Last Name</label>
                      <input
                        type="text"
                        class="form-control"
                        id="id-last_name"
                        name="last_name"
                        placeholder="Last name"
                        autofocus
                      />
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="id-email" class="form-label">Email</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id-email"
                    name="email"
                    placeholder="name@example.com"
                  />
                </div>

                <div class="mb-3">
                  <label for="id-phone_number" class="form-label">Phone Number</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id-phone_number"
                    name="phone_number"
                    placeholder="08xxxxxxxxx"
                    autofocus
                  />
                </div>

                <div class="mb-3 form-password-toggle">
                  <label class="form-label" for="id-password">Password</label>
                  <div class="input-group input-group-merge">
                    <input
                      type="password"
                      id="id-password"
                      class="form-control"
                      name="password"
                      placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                      aria-describedby="password"
                    />
                    <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                  </div>
                </div>
                
                <!-- SIGN UP BUTTON -->
                <div class="mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms-conditions" name="terms" />
                    <label class="form-check-label" for="terms-conditions">
                      I agree to
                      <a href="javascript:void(0);">privacy policy & terms</a>
                    </label>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary d-grid w-100">Sign up</button>
              </form>

              <p class="text-center">
                <span>Already have an account?</span>
                <a href="{% url 'auth:logout' %}">
                  <span>Sign in instead</span>
                </a>
              </p>
            </div>
          </div>
          <!-- Register Card -->
        </div>
      </div>
    </div>

    <!-- / Content -->

    <!-- Core JS -->
    {% include "layout/base_corejs.html" %}
  </body>
</html>
